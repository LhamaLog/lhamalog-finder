# Ambiente local do lhamalog-finder (somente desenvolvimento).
# Uso (na raiz do repositório): docker compose up --build
#   ou: make run | make infra-up | make infra-down
name: lhamalog-finder-local

services:
  finder:
    build:
      context: .
      dockerfile: Dockerfile
    image: lhamalog-finder
    container_name: lhamalog-finder
    restart: "no"
    # Mesma rede do Redis: o cliente em localhost:6379 alcança o serviço.
    network_mode: "service:redis"
    environment:
      FINDER_HTTP_ADDR: ":8085"
      FINDER_WORKERS: ${FINDER_WORKERS:-4}
      FINDER_REDIS_STREAM: ${FINDER_REDIS_STREAM:-fila:logs}
      FINDER_REDIS_GROUP: ${FINDER_REDIS_GROUP:-finder}
      FINDER_REDIS_CODIGOS: ${FINDER_REDIS_CODIGOS:-finder:codigos}
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8085/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Toolchain Go 1.27.0 para testes e vet, sem instalar Go na máquina.
  # Não sobe com `docker compose up`; use `docker compose run --rm gotools ...`.
  gotools:
    image: golang:1.27.0
    working_dir: /src
    volumes:
      - .:/src
    profiles:
      - tools
    entrypoint: ["go"]

  mongo:
    image: mongo:8.0.34
    container_name: lhamalog-finder-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-root}
      MONGO_INITDB_DATABASE: ${MONGO_APP_DATABASE:-lhamalog_collector}
      MONGO_APP_DATABASE: ${MONGO_APP_DATABASE:-lhamalog_collector}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-lhamalog}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-lhamalog}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:8.2.10
    container_name: lhamalog-finder-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
      - "${FINDER_PORT:-8085}:8085"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.5
    container_name: lhamalog-finder-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

volumes:
  mongo-data:
  redis-data:
  es-data: