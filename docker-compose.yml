# Ambiente local do lhamalog-finder (somente desenvolvimento).
# Uso (na raiz do repositório): docker compose up --build
#   ou: make run | make infra-up | make infra-down
name: lhamalog-finder-local

services:
  finder:
    build:
      context: .
      dockerfile: Dockerfile
    image: lhamalog-finder
    container_name: lhamalog-finder
    restart: "no"
    # Mesma rede do Redis: o cliente em localhost:6379 alcança o serviço.
    network_mode: "service:redis"
    environment:
      FINDER_HTTP_ADDR: ":8085"
      FINDER_WORKERS: ${FINDER_WORKERS:-4}
      FINDER_OPENOBSERVE_URL: http://openobserve:5080
      FINDER_OPENOBSERVE_ORG: ${OPENOBSERVE_ORG:-default}
      FINDER_OPENOBSERVE_USER: ${OPENOBSERVE_ROOT_EMAIL:-root@example.com}
      FINDER_OPENOBSERVE_PASSWORD: ${OPENOBSERVE_ROOT_PASSWORD:-Complexpass#123}
      FINDER_REDIS_STREAM: ${FINDER_REDIS_STREAM:-fila:logs}
      FINDER_REDIS_GROUP: ${FINDER_REDIS_GROUP:-finder}
      FINDER_REDIS_CODIGOS: ${FINDER_REDIS_CODIGOS:-finder:codigos}
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_healthy
      openobserve:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8085/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Toolchain Go 1.27.0 para testes e vet, sem instalar Go na máquina.
  # Não sobe com `docker compose up`; use `docker compose run --rm gotools ...`.
  gotools:
    image: golang:1.27.0
    working_dir: /src
    volumes:
      - .:/src
    profiles:
      - tools
    entrypoint: ["go"]

  mongo:
    image: mongo:8.0.34
    container_name: lhamalog-finder-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-root}
      MONGO_INITDB_DATABASE: ${MONGO_APP_DATABASE:-lhamalog_collector}
      MONGO_APP_DATABASE: ${MONGO_APP_DATABASE:-lhamalog_collector}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-lhamalog}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-lhamalog}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:8.2.10
    container_name: lhamalog-finder-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
      - "${FINDER_PORT:-8085}:8085"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # OpenObserve OSS v1.1.2. Porta 5080 e credencial inicial são as do guia oficial.
  # https://openobserve.ai/docs/getting-started/
  openobserve:
    image: openobserve/openobserve:v1.1.2
    container_name: lhamalog-finder-openobserve
    restart: unless-stopped
    environment:
      ZO_DATA_DIR: /data
      ZO_ROOT_USER_EMAIL: ${OPENOBSERVE_ROOT_EMAIL:-root@example.com}
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_ROOT_PASSWORD:-Complexpass#123}
    ports:
      - "${OPENOBSERVE_PORT:-5080}:5080"
    volumes:
      - openobserve-data:/data

volumes:
  mongo-data:
  redis-data:
  openobserve-data: